[workspace]
resolver = "3"
members = [
    "crates/sourcetrait_agnostic_windows",
]

[workspace.package]
version = "0.0.0-2"
edition = "2024"
authors = ["SourceTrait <development@sourcetrait.com"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/common_mono"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["sourcetrait", "common"]

[workspace.dependencies]
snafu = "0.8"
strum = { version = "0.27", features = ["derive"] }
widestring = "1"
windows-sys = { version = ">= 0.59, <=0.61", features = [
    "Win32_Networking_ActiveDirectory",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Security",
    "Win32_Security_Authorization",
]}

sourcetrait_agnostic_bridge = { path = "../../common/crates/sourcetrait_agnostic_bridge" }
sourcetrait_agnostic_unix = { path = "../../common_mono/unix/crates/sourcetrait_agnostic_unix" }
sourcetrait_stdx = { path = "../../common/crates/sourcetrait_stdx"  }
sourcetrait_testing = { path = "../../common/crates/sourcetrait_testing" }
sourcetrait_twostr = { path = "../../common/crates/sourcetrait_twostr" }
